if stamina() < 840 then

  print("Stamina is " .. stamina() .. " minutes (below 14 hours), going to trainers")

  return CaveBot.gotoLabel("Trainers")

else

  print("Stamina is " .. stamina() .. " minutes (above 14 hours), skipping trainers and going back to hunt")

  return CaveBot.gotoLabel("start")

end


]]

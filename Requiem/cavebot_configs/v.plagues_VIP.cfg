function:[[

if not hasSwords() then

  return true

else

  if isPoisioned() then

      say("exana pox")

  end

  if isCursed() then

      say("exana mort")

  end

  if isBurning() then

      say("exana flam")

  end

  if hasSwords() then

      delay(8000)

  end

  return "retry"

end


]]
